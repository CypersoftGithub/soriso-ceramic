<script>
// Responsive, Screenshot-style Tile Calculator (by Soriso)
$(function() {
  // Tile size DB: tile size (mm) => [tile sqm, tiles per box]
  const tileInfo = {
    '1000x1000': { sqm: 1.0, sqft: 10.7639, perBox: 2 },
    '800x800':   { sqm: 0.64, sqft: 6.88976, perBox: 3 },
    '1200x600':  { sqm: 0.72,  sqft: 7.74999, perBox: 2 },
    '600x600':   { sqm: 0.36, sqft: 3.87499, perBox: 4 },
    '600x1200':  { sqm: 0.72, sqft: 7.74999, perBox: 2 }
  };
  function round2(x) { return Math.round(x * 100) / 100; }

  $('#areaCalcForm').on('submit', function(e) {
    e.preventDefault();
    var len = parseFloat($('#inputLength').val()); // feet
    var wid = parseFloat($('#inputWidth').val());  // feet
    var tileKey = $('#inputTileSize').val();
    if (isNaN(len) || isNaN(wid) || len <= 0 || wid <= 0 || !(tileKey in tileInfo)) {
      $('#resultSqM').val('');
      $('#resultSqFt').val('');
      $('#resultTiles').val('');
      $('#resultBoxes').val('');
      return;
    }
    // Area in square feet & meters
    var areaFt = len * wid;
    var areaM = areaFt * 0.092903;
    // Tile size info
    var tsqm = tileInfo[tileKey].sqm;
    var tsqft = tileInfo[tileKey].sqft;
    var perBox = tileInfo[tileKey].perBox;
    var totalTiles = Math.ceil(areaFt / tsqft);
    var totalBoxes = Math.ceil(totalTiles / perBox);
    // Populate
    $('#resultSqM').val(round2(areaM));
    $('#resultSqFt').val(round2(areaFt));
    $('#resultTiles').val(totalTiles);
    $('#resultBoxes').val(totalBoxes);
  });
});
</script>
